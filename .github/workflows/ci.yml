name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    # Reviewed raster baselines are Windows Chromium, DPR 1.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: install
        run: uv sync --locked
      - name: install-web
        run: npm ci
      - name: install-browser
        run: npx playwright install chromium
      - name: Python, API, web, browser and launcher verification
        run: uv run python scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
