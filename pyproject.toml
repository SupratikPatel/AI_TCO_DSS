[project]
name = "ai-tco-dss"
version = "0.1.0"
description = "Enterprise AI Infrastructure Decision Support System (TCO for Sovereign AI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_tco_dss"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff also formats code blocks in Markdown; spec documents must stay unchanged.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/ai_tco_dss"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
